<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mandiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.3" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Background Rounded Icon Card -->
  <rect width="512" height="512" rx="112" fill="url(#mandiGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3" />

  <!-- Wheat / Mandi Graphic -->
  <g transform="translate(256, 230)" filter="url(#shadow)">
    <!-- Main stem -->
    <path d="M0,150 Q-10,30 0,-110" stroke="#fef08a" stroke-width="12" stroke-linecap="round" fill="none" />

    <!-- Wheat grains left -->
    <path d="M-8,-90 C-38,-100 -55,-70 -20,-50 C-10,-45 -5,-55 -8,-90 Z" fill="#fbbf24" />
    <path d="M-10,-40 C-46,-50 -65,-15 -25,0 C-12,5 -8,-5 -10,-40 Z" fill="#f59e0b" />
    <path d="M-10,15 C-48,5 -65,40 -25,55 C-12,60 -8,50 -10,15 Z" fill="#d97706" />
    <path d="M-10,70 C-45,60 -60,95 -22,110 C-10,115 -8,105 -10,70 Z" fill="#b45309" />

    <!-- Wheat grains right -->
    <path d="M8,-90 C38,-100 55,-70 20,-50 C10,-45 5,-55 8,-90 Z" fill="#fbbf24" />
    <path d="M10,-40 C46,-50 65,-15 25,0 C12,5 8,-5 10,-40 Z" fill="#f59e0b" />
    <path d="M10,15 C48,5 65,40 25,55 C12,60 8,50 10,15 Z" fill="#d97706" />
    <path d="M10,70 C45,60 60,95 22,110 C10,115 8,105 10,70 Z" fill="#b45309" />

    <!-- Top Awns / Whiskers -->
    <path d="M0,-110 L-25,-170" stroke="#fef08a" stroke-width="6" stroke-linecap="round" />
    <path d="M0,-110 L0,-185" stroke="#fef08a" stroke-width="6" stroke-linecap="round" />
    <path d="M0,-110 L25,-170" stroke="#fef08a" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Typography: MandiConnect -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="1.5">
    MANDICONNECT
  </text>
</svg>
